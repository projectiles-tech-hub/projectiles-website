name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website (checks, build, page tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note when the website source does not exist yet
        if: ${{ hashFiles('site/package.json') == '' }}
        run: echo "No site/package.json yet (the website is built from step 4); nothing to check."
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('site/package.json') != '' }}
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('site/package.json') != '' }}
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install, check, build and test
        if: ${{ hashFiles('site/package.json') != '' }}
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
